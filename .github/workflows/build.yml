name: Build Switch Homebrew

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  # Принудительно используем Node.js 20 для совместимости
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: true

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build project
        run: |
          make -j8

      - name: Upload .nro artifact
        uses: actions/upload-artifact@v4
        with:
          name: chromium-switch
          path: chromium_switch.nro
